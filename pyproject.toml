[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-git-todo"
version = "0.2.0"
description = "A tiny command-line to-do manager"
requires-python = ">=3.9"

[project.scripts]
todo = "todo.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
